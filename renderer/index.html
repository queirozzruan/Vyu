<!DOCTYPE html>
<html class="dark" lang="pt-BR" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vyu</title>
  <script>
    (() => {
      try {
        const savedTheme = window.localStorage.getItem('vyu:theme') || window.localStorage.getItem('mhqviewer:theme');
        const parsedTheme = savedTheme ? JSON.parse(savedTheme) : 'dark';
        const theme = parsedTheme === 'light' ? 'light' : 'dark';
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-error-container": "#ffdad6", "on-surface": "#e2e2e2", "primary-fixed-dim": "#454747",
            "on-surface-variant": "#c6c6c6", "on-primary-container": "#000000", "on-error": "#690005",
            "outline": "#919191", "on-primary": "#1a1c1c", "surface": "#131313", "on-secondary": "#1b1c1c",
            "surface-bright": "#393939", "surface-container-high": "#2a2a2a", "inverse-on-surface": "#303030",
            "on-background": "#e2e2e2", "background": "#131313", "tertiary-fixed": "#5f5e5e",
            "primary-container": "#d4d4d4", "secondary-fixed": "#c8c6c5", "inverse-primary": "#5d5f5f",
            "primary-fixed": "#5d5f5f", "on-tertiary-container": "#000000", "secondary": "#c8c6c5",
            "on-tertiary-fixed-variant": "#e5e2e1", "tertiary": "#e5e2e1", "surface-tint": "#c6c6c7",
            "surface-container-low": "#1b1b1b", "tertiary-container": "#929090", "error": "#ffb4ab",
            "tertiary-fixed-dim": "#474646", "primary": "#ffffff", "on-tertiary-fixed": "#ffffff",
            "on-tertiary": "#1c1b1b", "surface-container": "#1f1f1f", "error-container": "#93000a",
            "on-secondary-fixed-variant": "#3b3b3b", "surface-variant": "#353535", "on-primary-fixed-variant": "#e2e2e2",
            "surface-container-highest": "#353535", "on-secondary-fixed": "#1b1c1c", "on-secondary-container": "#e4e2e1",
            "outline-variant": "#474747", "inverse-surface": "#e2e2e2", "on-primary-fixed": "#ffffff",
            "secondary-fixed-dim": "#acabaa", "surface-dim": "#131313", "secondary-container": "#474746",
            "surface-container-lowest": "#0e0e0e"
          },
          fontFamily: { "headline": ["Fraunces"], "body": ["IBM Plex Sans"], "label": ["IBM Plex Sans"] },
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #353535;
      border-radius: 10px;
    }

    .manga-page-shadow {
      box-shadow: 0 0 100px rgba(0, 0, 0, 0.9);
    }
  </style>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <div id="app">
    <section id="library-screen" class="screen active library-shell">
      <div class="library-backdrop" aria-hidden="true"></div>

      <header class="floating-menu" aria-label="Menu da biblioteca">
        <div class="brand-mark" aria-label="Vyu">
          <span class="brand-symbol">V</span>
          <span class="brand-name">Vyu</span>
        </div>

        <nav id="library-view-tabs" class="view-tabs" aria-label="Vistas da biblioteca" role="tablist">
          <button class="view-tab" type="button" role="tab" data-library-view="recent" aria-selected="false">
            <span class="material-symbols-outlined">history</span>
            <span>Vistos recentes</span>
          </button>
          <button class="view-tab" type="button" role="tab" data-library-view="favorites" aria-selected="false">
            <span class="material-symbols-outlined">star</span>
            <span>Favoritos</span>
          </button>
          <button class="view-tab is-active" type="button" role="tab" data-library-view="collection" aria-selected="true">
            <span class="material-symbols-outlined">library_books</span>
            <span>Cole&ccedil;&atilde;o</span>
          </button>
        </nav>

        <div class="floating-actions">
          <button id="theme-toggle-btn" class="icon-action" type="button" title="Alternar para tema claro" aria-pressed="true">
            <span class="material-symbols-outlined">dark_mode</span>
          </button>
          <button id="add-directory-btn" class="icon-action" type="button" title="Adicionar pasta">
            <span class="material-symbols-outlined">create_new_folder</span>
          </button>
          <button id="open-comic-btn" class="icon-action is-primary" type="button" title="Abrir HQ ou Mang&aacute;">
            <span class="material-symbols-outlined">folder_open</span>
          </button>
        </div>
      </header>

      <main class="library-main custom-scrollbar">
        <section class="library-intro">
          <p class="intro-kicker">Biblioteca local</p>
          <div class="intro-copy">
            <h1 id="library-view-title">Cole&ccedil;&atilde;o</h1>
            <p id="library-view-description">Sua biblioteca local agrupada por pastas, com as HQs e mang&aacute;s equivalentes em cada uma.</p>
          </div>
          <div id="directory-list" class="directory-list" aria-label="Pastas monitoradas"></div>
        </section>

        <section class="library-content">
          <div class="section-heading">
            <div>
              <h2 id="library-section-title">Pastas da cole&ccedil;&atilde;o</h2>
              <p id="library-meta">0 pastas</p>
            </div>
          </div>

          <div id="library-grid" class="library-grid"></div>
          <div id="library-empty" class="library-empty"></div>
        </section>
      </main>
    </section>

    <section id="reader-screen" class="screen reader-shell">
      <main class="reader-main">
        <div id="page-stage" class="page-stage custom-scrollbar" tabindex="0">
          <div id="page-scroll-content" class="page-scroll-content">
            <img id="page-image" style="display: none;" alt="P&aacute;gina da HQ" class="page-image" />
            <div id="loading-container" class="reader-loading">
              <span class="material-symbols-outlined">progress_activity</span>
              <span id="loading-text">Carregando quadrinho...</span>
            </div>
          </div>
        </div>

        <header class="reader-toolbar">
          <button id="back-library-btn" class="reader-icon-btn" type="button" title="Voltar para biblioteca">
            <span class="material-symbols-outlined">arrow_back</span>
          </button>

          <div class="reader-title-wrap">
            <p id="reader-series" class="reader-series">-</p>
            <p id="reader-page-counter" class="reader-counter">P. 000 / 000</p>
          </div>

          <div class="reader-toolbar-actions">
            <div class="reader-zoom-control" aria-label="Zoom">
              <button id="zoom-out-btn" class="reader-icon-btn is-small" type="button" title="Diminuir zoom">
                <span class="material-symbols-outlined">remove</span>
              </button>
              <span id="zoom-value" class="zoom-value">100%</span>
              <button id="zoom-in-btn" class="reader-icon-btn is-small" type="button" title="Aumentar zoom">
                <span class="material-symbols-outlined">add</span>
              </button>
            </div>

            <button id="fit-mode-btn" class="reader-fit-btn" type="button" title="Ajustar pela largura" aria-pressed="false">
              <span class="material-symbols-outlined">fit_screen</span>
              <span id="fit-mode-label">Altura</span>
            </button>

            <button id="open-other-btn" class="reader-icon-btn" type="button" title="Abrir outra HQ">
              <span class="material-symbols-outlined">folder_open</span>
            </button>
          </div>
        </header>

        <button id="prev-btn" class="reader-side-btn is-left" type="button" title="P&aacute;gina anterior">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>

        <button id="next-btn" class="reader-side-btn is-right" type="button" title="Pr&oacute;xima p&aacute;gina">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>

        <div class="reader-progress-rail" aria-hidden="true">
          <div id="reader-progress-bar"></div>
        </div>

        <footer class="reader-bottombar">
          <button id="first-page-btn" class="reader-icon-btn is-small" type="button" title="Primeira p&aacute;gina">
            <span class="material-symbols-outlined">first_page</span>
          </button>
          <input id="reader-page-slider" class="reader-page-slider" type="range" min="1" max="1" value="1" aria-label="Navegar p&aacute;ginas" />
          <button id="last-page-btn" class="reader-icon-btn is-small" type="button" title="&Uacute;ltima p&aacute;gina">
            <span class="material-symbols-outlined">last_page</span>
          </button>
          <span id="reader-progress-text" class="reader-progress-text">0%</span>
        </footer>
      </main>
    </section>
  </div>

  <script type="module" src="./renderer.js"></script>
</body>

</html>
