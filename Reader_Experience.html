<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #353535;
      border-radius: 10px;
    }
    .reader-gradient-top {
      background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    }
    .reader-gradient-bottom {
      background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, transparent 100%);
    }
    .manga-page-shadow {
      box-shadow: 0 0 100px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body class="bg-surface-container-lowest font-body text-on-surface selection:bg-primary selection:text-on-primary overflow-hidden">
<!-- Reader Canvas (Pure Black Background) -->
<main class="relative w-full h-screen flex justify-center bg-black overflow-hidden">
<!-- Manga Content Container -->
<div class="h-full w-full max-w-4xl flex flex-col items-center overflow-y-auto custom-scrollbar manga-page-shadow">
<div class="w-full flex flex-col items-center space-y-4 py-8">
<img alt="High-quality black and white manga page artwork" class="w-full object-contain shadow-2xl" data-alt="Manga page with intricate black and white illustration" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA0NJzcwofBfpU8HOEe1aiTW8xFDLdscHcESMjLaVuvx9oXlCbHVtNg6D1ZEXAetlX7TTOBDteS_aBJGjHdFdz-_IVQjjhDsfNuL6nyF6qqwqmOBbyzQJE2GZwI2PfcPed2AVtW-mmezedlupY26I3tsbD3GoXtSwKnmS8x-cppuPdc5Y3EMfYrqEBmO1gqJF2M4dRzQvXtRop7UP9sw1oBfs9mGP3haO6vQuoeTIgPPTzQBMdMCIUbvN3SmDvX5Wesjxy9jQ3kVz4"/>
<img alt="Sequential manga panels on white background" class="w-full object-contain shadow-2xl" data-alt="Manga panels showing character dialogue and action" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBleU0MdBAGANmzVWO3bZA4Xl4ExFhNhgdMcpZck8uTbsDEHAYcP5BT5tz0PS-NWz_dzN7yxYd09ucVOPCxYWnPuG8SHcMiJbwQLz_PLocez2XmSVeoaifU27QSup4CyPvBg6MMf0y7IJQrg_tkFMmGUo8ulzKHjiwOYxxL0ijbNDHtMswm2ImxNIUz_2hPc40wenqOn_1RNiZfhQx5OIfsJcDtaMs-qQi_tlUpNvuMKcAxi28-JCAayIuvU25tJqVwItmOhU0383A"/>
</div>
</div>
<!-- Top Overlay Controls (Shared Component: TopAppBar Small) -->
<!-- Rule: Transferred style_shell_layout, style_bg_color, etc. from JSON -->
<header class="fixed top-0 left-1/2 -translate-x-1/2 z-50 flex items-center gap-8 py-2 bg-[#1B1B1B]/70 backdrop-blur-md text-[#FFFFFF] font-inter text-xs font-semibold rounded-lg mt-4 px-6 outline-variant/15 shadow-2xl shadow-black/50" data-location="Reader Controls">
<div class="flex items-center gap-6">
<!-- Vertical/Horizontal Mode Toggle -->
<div class="flex items-center gap-3">
<button class="flex items-center gap-2 text-white hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="swap_calls">swap_calls</span>
<span class="uppercase tracking-widest">Vertical Scroll</span>
</button>
<div class="h-4 w-[1px] bg-outline-variant/30"></div>
<button class="flex items-center gap-2 text-[#C6C6C6] hover:text-white transition-colors">
<span class="material-symbols-outlined text-sm" data-icon="view_column">view_column</span>
<span class="uppercase tracking-widest">Paginated</span>
</button>
</div>
<!-- Zoom Controls -->
<div class="flex items-center gap-4 bg-surface-container-high/40 px-3 py-1 rounded-md">
<button class="text-[#C6C6C6] hover:text-white transition-colors">
<span class="material-symbols-outlined text-base" data-icon="remove">remove</span>
</button>
<span class="min-w-[3ch] text-center">85%</span>
<button class="text-[#C6C6C6] hover:text-white transition-colors">
<span class="material-symbols-outlined text-base" data-icon="zoom_in">zoom_in</span>
</button>
</div>
<!-- Exit/Close -->
<button class="flex items-center justify-center hover:bg-[#353535] rounded-full p-1 transition-all">
<span class="material-symbols-outlined text-lg" data-icon="close">close</span>
</button>
</div>
</header>
<!-- Navigation Cues (Discreet Side Arrows) -->
<div class="absolute inset-y-0 left-0 w-32 group flex items-center justify-center cursor-pointer pointer-events-auto">
<div class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/40 p-4 rounded-full backdrop-blur-sm">
<span class="material-symbols-outlined text-white text-3xl" data-icon="chevron_left">chevron_left</span>
</div>
</div>
<div class="absolute inset-y-0 right-0 w-32 group flex items-center justify-center cursor-pointer pointer-events-auto">
<div class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-black/40 p-4 rounded-full backdrop-blur-sm">
<span class="material-symbols-outlined text-white text-3xl" data-icon="chevron_right">chevron_right</span>
</div>
</div>
<!-- Keyboard Shortcuts Hint (Floating Bottom) -->
<div class="fixed bottom-8 left-1/2 -translate-x-1/2 z-40">
<div class="bg-surface-container-low/60 backdrop-blur-xl border border-outline-variant/10 px-4 py-2 rounded-full flex items-center gap-3">
<div class="flex items-center gap-1">
<span class="px-1.5 py-0.5 bg-surface-container-highest text-[10px] rounded border border-outline-variant/30 text-white font-mono">←</span>
<span class="px-1.5 py-0.5 bg-surface-container-highest text-[10px] rounded border border-outline-variant/30 text-white font-mono">→</span>
</div>
<span class="text-[11px] font-medium text-on-surface-variant uppercase tracking-widest">Use keys for pages</span>
</div>
</div>
<!-- Reader Progress Indicator (Floating Edge) -->
<div class="fixed right-6 bottom-8 z-40 flex flex-col items-end gap-2">
<div class="bg-surface-container-low/80 backdrop-blur-md px-3 py-1 rounded text-[10px] font-bold tracking-widest text-on-surface-variant">
        P. 042 / 218
      </div>
<div class="w-1.5 h-32 bg-surface-container rounded-full overflow-hidden">
<div class="w-full h-1/4 bg-primary"></div>
</div>
</div>
</main>
<!-- Side Overlays (Hidden by Default, Triggered by UI) -->
<div class="sr-only">Reader Canvas Active: Sidebar and SideNav suppressed per mandate.</div>
</body></html>
